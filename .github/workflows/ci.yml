name: .NET CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore UniManager.slnx

      - name: Build solution
        run: dotnet build UniManager.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test UniManager.slnx --configuration Release --no-build --no-restore --logger "trx;LogFileName=test-results.trx"
